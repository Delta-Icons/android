name: build-nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: android
    env:
      KEYSTORE_PATH: /tmp/release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for changes in the last 24h
        id: changes
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          if [ $((NOW - LAST)) -lt 86400 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing key
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleNightlyRelease --no-daemon

      - name: Sign and publish APK
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=/opt/android-sdk/build-tools/34.0.0
          IN=$(ls app/build/outputs/apk/nightly/release/*.apk | grep -v unsigned | head -n 1 || true)
          [ -z "$IN" ] && IN=$(ls app/build/outputs/apk/nightly/release/*-unsigned.apk | head -n 1)
          echo "Input APK: $IN"

          $BT/zipalign -f -p 4 "$IN" /tmp/aligned.apk
          $BT/apksigner sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out /tmp/signed.apk /tmp/aligned.apk
          $BT/apksigner verify --print-certs /tmp/signed.apk

          NAME="delta-nightly-$(date +%Y%m%d%H%M%S).apk"
          cp /tmp/signed.apk /home/gitro/apk-share/incoming/.partial.apk
          mv /home/gitro/apk-share/incoming/.partial.apk "/home/gitro/apk-share/incoming/$NAME"

      - name: Remove signing key
        if: always()
        run: rm -f "$KEYSTORE_PATH"