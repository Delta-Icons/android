name: Check for Conflicts
run-name: conflicts @ ${{ github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - contribs/icons/**
      - contribs/icons.yml

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  PYTHONUNBUFFERED: 1

jobs:
  build:
    name: Check for Conflicts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: resources/scripts
    steps:

    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Setup Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: resources/scripts/requirements.txt

    - name: Install Python deps
      run: |
        pip install -r requirements.txt

    - name: Process icons in dry run
      run: |
        python process_icons.py -d 2>&1
